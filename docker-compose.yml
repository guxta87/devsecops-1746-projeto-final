services:
  aurora-api:
    build:
      context: .
    image: clube-aurora-api:local
    container_name: aurora-api
    ports:
      - "8080:8080"
    environment:
      SECRET_KEY: "${SECRET_KEY:?Defina SECRET_KEY no arquivo .env local}"
      SEED_PASSWORD: "${SEED_PASSWORD:?Defina SEED_PASSWORD no arquivo .env local}"
      DATABASE: /app/instance/aurora.db
    volumes:
      - aurora-data:/app/instance
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped

volumes:
  aurora-data:
